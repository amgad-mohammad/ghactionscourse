name: Manual API WorkFlow # name of the workflow

on:
  repository_dispatch: # can only be triggered via REST API (not GitHub UI or gh workflow run)
    types: [incident-report] # you must pass this event_type in the API request payload

jobs:
  handle-incident: # job name
    runs-on: ubuntu-latest # runner
    steps:
      - name: Print Incident Details # step name
        run: echo "Incident reported" # run shell command

#Notes:
#1. repository_dispatch can ONLY be triggered externally via REST API (or gh api), NOT via GitHub UI or gh workflow run
#2. Payload data arrives as github.event.client_payload, not as workflow_dispatch "inputs"
#3. Trigger via CLI: gh api repos/OWNER/REPO/dispatches -f event_type=incident-report
#4. Trigger via REST API: curl -X POST -H "Authorization: token TOKEN" https://api.github.com/repos/OWNER/REPO/dispatches -d '{"event_type":"incident-report"}'
